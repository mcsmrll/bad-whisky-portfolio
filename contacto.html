<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Bad Whisky</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="main-header">
        <div class="container header-flex">
            <div class="logo">
                <h1>BAD<span>WHISKY</span></h1>
            </div>
            <button class="menu-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="#">Work</a>
                <a href="#">About</a>
                <a href="contacto.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container contact-section">
        <div class="contact-grid">

            <div class="contact-info">
                <h1>Hablemos</h1>
                <p class="intro-text">¿Tienes un proyecto en mente? Rellena el formulario o envíanos un email directo.
                </p>

                <div class="details">
                    <p class="location">Murcia, España</p> <a href="mailto:sofiamaciasmorillo@gmail.com"
                        class="email-link">info@badwhisky.com</a>
                </div>
            </div>

            <div class="contact-form-wrapper">
                <form class="minimal-form" action="https://formspree.io/f/mqedbqvd" method="POST">

                    <div class="form-group">
                        <label for="name">Nombre y Apellidos</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="company">Empresa</label>
                        <input type="text" id="company" name="company">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Tu Mensaje</label>
                        <textarea id="message" name="message" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Enviar Mensaje</button>
                </form>
            </div>

        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-inner">
            <div class="footer-col copyright">
                <p>&copy; 2026 Bad Whisky</p>
            </div>
            <div class="footer-col social">
                <a href="https://www.instagram.com/badwhiskybw/" target="_blank" rel="noopener">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-instagram">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
            </div>
            <div class="footer-col privacy">
                <a href="#">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
</body>

</html>
